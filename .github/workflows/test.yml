name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Tests use a fake `hey`; HEY_BIN is unset and no real HEY CLI is installed.
      - run: npm test
      - run: npm run skill:check

  pack-smoke:
    # Packs the module, installs the tarball into a clean temp project, and runs the
    # installed hey-axi --version / --help. No HEY binary or account is involved.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm run smoke:pack
